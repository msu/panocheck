[project]
name = "panocheck"
version = "0.1.0"
description = "Document accessibility checker and fixer"
readme = "README.md"
requires-python = ">=3.11"
license = "0BSD"
dependencies = ["lxml>=5", "html5lib>=1.1", "pikepdf>=9", "pymupdf>=1.24"]

[project.optional-dependencies]
canvas = ["canvasapi>=3"]
media = ["yt-dlp"]
dev = ["pytest>=8", "pyyaml>=6"]

[project.scripts]
panocheck = "panocheck:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["panocheck.py"]
