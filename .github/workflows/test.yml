name: test
on:
  push: {branches: [main]}
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e 'src/python[dev]'
      - run: python src/tools/sync_spec.py --check
      - run: pytest src/python/tests
  web:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: src/web}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
  libreoffice-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: sudo apt-get update && sudo apt-get install -y libreoffice
      - run: pip install -e 'src/python[dev]' python-docx python-pptx openpyxl
      - run: python src/tools/lo_smoke.py
